apply plugin: 'com.android.application'

android {
    // Initial compatibility build: modern toolchain, unchanged legacy game code.
    compileSdkVersion 33

    defaultConfig {
        applicationId "edu.up.cs.androidcatan"
        minSdkVersion 25
        targetSdkVersion 27
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '2').toInteger()
        versionName "1.1-test"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        // Allow local JVM rules tests to use Android's Log class as a no-op.
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Keep the original support libraries until the baseline APK is tested.
    implementation 'com.android.support:appcompat-v7:27.1.1'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'com.android.support:recyclerview-v7:27.1.1'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
