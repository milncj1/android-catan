name: Approved Android APK

# Commits on the development branch never build.
# When the owner approves a build, create a new branch named apk-build/NNN-*.
on:
  push:
    branches:
      - 'apk-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved source snapshot
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse Gradle dependencies where possible
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug Android APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Attach test APK
        uses: actions/upload-artifact@v4
        with:
          name: catan-android-test-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
