name: Owner-approved Android APK

# Source commits never trigger a build. A build only starts when we create
# an owner-approved apk-build/* snapshot branch.
on:
  push:
    branches:
      - 'apk-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved source snapshot
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Validate Android XML before compilation
        run: python3 ci/check_android_xml.py
      - name: Run local JVM unit tests and assemble debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload one unsigned-for-delivery test artifact
        uses: actions/upload-artifact@v4
        with:
          name: catan-build-${{ github.run_number }}-for-permanent-signing
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
